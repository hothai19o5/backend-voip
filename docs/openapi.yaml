openapi: 3.0.3
info:
  title: VoIP API
  version: 0.2.0
  description: >-
    Registration creates a USER and provisions its FusionPBX extension automatically.
    Bearer JWTs use persisted revocable sessions. Account status is independent of
    realtime presence. This spec is the interface source of truth; API.md explains
    usage and the local Postman collection provides one editable request per endpoint.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Registration and revocable bearer sessions
  - name: Users
    description: Own profile and public user directory
  - name: Presence
    description: Active application sessions
  - name: SIP
    description: Own calling connection configuration
  - name: Message history
    description: Stored web chat and the authenticated account's SIP history
  - name: Calls
    description: SIP destination lookup and web-observed call history
paths:
  /api/v1/calls/dialed:
    get:
      tags: [Calls]
      summary: List up to 30 finalized calls dialed by the current user
      operationId: listDialedCalls
      responses:
        '200':
          description: Most recent first. Results are populated when the browser reports the SIP outcome.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DialedCall'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/calls/resolve:
    post:
      tags: [Calls]
      summary: Resolve a phone number into a SIP destination for the current user
      operationId: resolvePhoneCall
      description: >-
        The browser uses the returned SIP URI to send the INVITE. By default,
        a number assigned to an active app account resolves to its extension.
        Set forcePstn to route a supported Vietnamese phone number through the
        caller's outbound gateway even when the number belongs to an app account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phoneNumber]
              properties:
                phoneNumber: {type: string, minLength: 1, maxLength: 40, example: '090 000 0002'}
                forcePstn: {type: boolean, default: false}
      responses:
        '200':
          description: An app SIP extension or a Vietnamese mobile or landline on the caller's SIP domain.
          content:
            application/json:
              schema:
                type: object
                required: [type, phoneNumber, sipUri, displayName]
                properties:
                  type: {type: string, enum: [APP_TO_APP, APP_TO_PHONE]}
                  phoneNumber: {type: string, example: '+84900000002'}
                  sipUri: {type: string, example: 'sip:1002@pbx.test'}
                  displayName: {type: string, nullable: true}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: PSTN_DESTINATION_DENIED when the requested PSTN destination is outside the supported Vietnamese ranges.
        '409':
          description: SELF_CALL, APP_DESTINATION_UNAVAILABLE or CALLER_SIP_UNAVAILABLE.
        '503':
          description: PHONE_CALLING_DISABLED until configured and all accounts have a phone.
  /api/v1/calls:
    post:
      tags: [Calls]
      operationId: saveCallResult
      summary: Save a finished call for the current user
      description: >-
        Retry with the same ID and direction to avoid duplicates. An incoming
        result with stronger evidence can replace an unanswered observation.
        This records a web client observation and does not query PBX CDRs.
        An outgoing voice result with dialedPhoneNumber also appears in recent
        dialed calls. Those PSTN results are excluded from chat history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallWrite' }
      responses:
        '204':
          description: Result stored or already reported
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The ID and direction already belong to a different SIP peer
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [Calls]
      operationId: listCallHistory
      summary: List the current user's calls, newest first
      parameters:
        - name: missed
          in: query
          description: Only list missed incoming calls, including previously seen calls
          schema: { type: boolean, default: false }
        - name: peer
          in: query
          description: Limit to one SIP address. With this filter, calls are ordered by end time for the chat timeline.
          schema: { type: string, maxLength: 320, example: 'sip:1002@pbx.test' }
        - name: before
          in: query
          description: Cursor returned in nextCursor from the preceding page with the same filter
          schema: { type: string, pattern: '^[0-9]{1,19}:[0-9]{1,19}$' }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Call history page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/calls/threads:
    get:
      tags: [Calls]
      operationId: listCallThreads
      summary: List recent call activity for each chat peer
      parameters:
        - name: before
          in: query
          description: Cursor from the previous thread page
          schema: { type: string, pattern: '^[0-9]{1,19}:[0-9]{1,19}$' }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Latest call by end time and the unseen missed call summary for each peer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallThreadPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/calls/missed:
    get:
      tags: [Calls]
      operationId: getMissedCallSummary
      summary: Get the current user's unseen missed call count
      responses:
        '200':
          description: Unseen missed call count and acknowledgment sequence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissedCalls' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Calls]
      operationId: markMissedCallsSeen
      summary: Mark the missed calls in a snapshot as seen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [through]
              properties:
                through:
                  description: Non-null sequence returned in the summary to acknowledge
                  type: string
                  pattern: '^[0-9]{1,19}$'
                peer:
                  description: Mark only the selected SIP peer when supplied and return that peer's updated count
                  type: string
                  maxLength: 320
      responses:
        '200':
          description: Updated summary including any missed calls reported after the acknowledged snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissedCalls' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/presence/heartbeat:
    post:
      tags: [Presence]
      operationId: presenceHeartbeat
      summary: Renew the caller's presence and read online user IDs
      description: >-
        Renews the authenticated session's presence for 75 seconds. The snapshot
        includes the caller and other ACTIVE users with at least one recent,
        unexpired, unrevoked session. SIP registration is independent. Cache-Control no-store.
      responses:
        '200':
          description: Current online application users
          content:
            application/json:
              schema:
                type: object
                required: [onlineUserIds]
                properties:
                  onlineUserIds:
                    type: array
                    uniqueItems: true
                    items: { type: string, format: uuid }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/message-history/attachments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, maxLength: 100}
    put:
      tags: [Message history]
      operationId: sendAttachment
      summary: Send a file to another VoIP user
      description: Use the same client request ID to retry the same peer and file. The response contains the stored message ID.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [peer, file]
              properties:
                peer: {type: string, example: 'sip:1002@pbx.test'}
                file: {type: string, format: binary, description: 'One nonempty file, up to 10 MiB'}
      responses:
        '200':
          description: Attachment message saved for sender and recipient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': {description: Sender or recipient cannot use web chat}
        '404': {description: Destination has no VoIP web account}
        '409': {description: Conflicting retry or unavailable SIP mapping}
        '413': {description: File is larger than 10 MiB}
        '503': {description: Object storage unavailable}
    get:
      tags: [Message history]
      operationId: downloadAttachment
      summary: Download an attachment from the caller's own chat history
      description: Pass the stored message ID from a history entry. Only the sender and recipient have access.
      responses:
        '200':
          description: File bytes with attachment disposition and no-store caching
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            'image/*':
              schema: {type: string, format: binary}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404': {description: Attachment is missing or absent from caller's history}
        '503': {description: Object storage unavailable}
  /api/v1/message-history/send/{id}:
    put:
      tags: [Message history]
      operationId: sendDirectMessage
      summary: Store a direct message for both web accounts
      description: >-
        Derives the sender from the bearer token and resolves the recipient by
        SIP address in the local account mapping. Saves outgoing and incoming
        entries atomically and returns the outgoing entry after commit.
        No SIP registration or FusionPBX request is required. Retry with the
        same id and content after an uncertain result. Only SIP_ONLY indicates
        the address is outside web chat and may be handled by a SIP client.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,58}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer, body]
              properties:
                peer: { type: string, maxLength: 320, example: 'sip:1002@pbx.test' }
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '200':
          description: Both entries persisted, including on duplicate retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: CHAT_UNAVAILABLE when the recipient is blocked
        '404':
          description: SIP_ONLY when no local mapping exists for the peer
        '409':
          description: MESSAGE_CONFLICT for a changed retry or CHAT_UNAVAILABLE for an unusable mapping
  /api/v1/message-history/updates:
    get:
      tags: [Message history]
      operationId: listHistoryUpdates
      summary: List own new history entries in ascending sequence order
      description: >-
        Initialize after from the newest entry of the first conversation page,
        or use 0 for an empty history. Advance after to the last returned
        sequence. A non-null nextCursor indicates more entries are available.
        Only new entries are returned. The response does not acknowledge reading.
      parameters:
        - name: after
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]{1,19}$' }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: New entries strictly after the supplied sequence
          content:
            application/json:
              schema:
                type: object
                required: [content, nextCursor]
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryEntry'
                  nextCursor: { type: string, nullable: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/message-history/messages/{id}:
    put:
      tags: [Message history]
      operationId: saveMessageHistory
      summary: Save or acknowledge a SIP message in own history
      description: >-
        Idempotent by caller and local id. Does not send a SIP message or provide
        offline delivery. Plaintext history, no additional encryption. Only pending
        can transition to accepted/failed; terminal status never regresses on retry.
        Immutable account, peer, direction, body and time must match on retry.
        Owner is derived from bearer subject. Does not call FusionPBX.
        IDs beginning with chat: are reserved for direct messages.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,100}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryWrite'
      responses:
        '200':
          description: Message persisted, including on duplicate retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: MESSAGE_CONFLICT - same id with different immutable content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/message-history/conversations:
    get:
      tags: [Message history]
      operationId: listHistoryConversations
      summary: List own conversations with their latest saved message
      description: >-
        Descending database sequence order, one latest entry per normalized peer.
        Cursor pagination is a live view; a conversation receiving a newer message
        during paging can move to the first page. Refresh the list to see it.
      parameters:
        - $ref: '#/components/parameters/HistoryBefore'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Conversation page; null nextCursor means no older entries
          content:
            application/json:
              schema:
                type: object
                required: [content, nextCursor]
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      required: [peer, name, lastMessage]
                      properties:
                        peer: { type: string }
                        name: { type: string }
                        lastMessage:
                          $ref: '#/components/schemas/HistoryEntry'
                  nextCursor: { type: string, nullable: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/message-history/messages:
    get:
      tags: [Message history]
      operationId: listHistoryMessages
      summary: List saved messages for one peer, newest first
      parameters:
        - name: peer
          in: query
          required: true
          schema: { type: string, maxLength: 320 }
          example: sip:1002@pbx.test
        - $ref: '#/components/parameters/HistoryBefore'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Message page; null nextCursor means no older entries
          content:
            application/json:
              schema:
                type: object
                required: [content, nextCursor]
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryEntry'
                  nextCursor: { type: string, nullable: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a user account
      description: >-
        Trims identity fields, hashes the password and provisions a numeric extension
        through FusionPBX. Returns success only after the mapping and encrypted SIP
        password are persisted. A timed-out create keeps an UNKNOWN reservation and
        is not retried automatically. Does not log in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: alice
              email: alice@example.com
              password: example-password
              displayName: Alice
              phoneNumber: '+84900000001'
      responses:
        '201':
          description: Account created with role USER, status ACTIVE and SIP provisioningStatus READY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Username, email or phone already exists, or extension allocation conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          $ref: '#/components/responses/TelephonyFailure'
        '503':
          $ref: '#/components/responses/TelephonyFailure'
        '504':
          $ref: '#/components/responses/TelephonyFailure'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Create a bearer session
      description: >-
        Username is trimmed and matched case-insensitively. Password is preserved
        exactly. Legacy users without a SIP mapping are provisioned after successful
        password verification. Pending/failed/unknown provisioning returns 503 without
        issuing a session. Token lifetime defaults to 8 hours.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: alice
              password: example-password
      responses:
        '200':
          description: Bearer token and own profile; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '502':
          $ref: '#/components/responses/TelephonyFailure'
        '503':
          $ref: '#/components/responses/TelephonyFailure'
        '504':
          $ref: '#/components/responses/TelephonyFailure'
        '409':
          $ref: '#/components/responses/TelephonyFailure'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: INVALID_CREDENTIALS for wrong username/password or blocked account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current bearer session
      description: Other sessions remain active. Reusing this token, including another logout, returns 401.
      responses:
        '204':
          description: Session revoked; empty response body
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user profile
      description: Resolves the configured PBX domain and reads extension-list to verify the caller's mapping.
      responses:
        '200':
          description: Own profile including email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/TelephonyFailure'
        '503':
          $ref: '#/components/responses/TelephonyFailure'
        '504':
          $ref: '#/components/responses/TelephonyFailure'
  /api/v1/users/contact-phone:
    get:
      tags: [Users]
      operationId: getContactPhone
      summary: Get the registered phone number for a chat contact
      description: >-
        Uses the local SIP mapping for the selected contact. Returns null for
        external, blocked, or unmapped contacts and for accounts without a number.
      parameters:
        - name: peer
          in: query
          required: true
          schema:
            type: string
            maxLength: 320
            example: 'sip:1002@pbx.test'
      responses:
        '200':
          description: Contact phone number in E.164 or null
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [phoneNumber]
                properties:
                  phoneNumber: {type: string, nullable: true, example: '+84900000002'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Search other users without requiring a contact relationship
      description: >-
        Excludes caller; includes accounts with and without sessions and BLOCKED
        accounts. Calls FusionPBX extension-list on every valid request and joins
        mapped UUID and number to each app user. PBX-only extensions are not app/chat
        identities. Includes a snapshot of application presence in online. Ordered
        by username then UUID. Email and credentials are never exposed. Dependency errors are
        returned rather than presenting a local-only result as current.
      parameters:
        - name: q
          in: query
          description: Trimmed case-insensitive literal substring on username or displayName; percent and underscore are literal.
          schema:
            type: string
            maxLength: 100
            default: ''
        - name: page
          in: query
          description: Zero-based page index; page multiplied by size must fit a signed 32-bit integer.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Maximum entries per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Stable user page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/TelephonyFailure'
        '503':
          $ref: '#/components/responses/TelephonyFailure'
        '504':
          $ref: '#/components/responses/TelephonyFailure'
  /api/v1/sip/account:
    get:
      tags: [SIP]
      operationId: getOwnSipAccount
      summary: Get the caller's SIP connection credentials
      description: >-
        Verifies the mapped extension against FusionPBX before decrypting the SIP
        password. Always scoped to the bearer subject. Never accepts a target user
        ID or returns the administrative REST token. Cache-Control no-store.
      responses:
        '200':
          description: Own SIP connection credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SipCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/TelephonyFailure'
        '503':
          $ref: '#/components/responses/TelephonyFailure'
        '504':
          $ref: '#/components/responses/TelephonyFailure'
components:
  parameters:
    HistoryBefore:
      name: before
      in: query
      description: Positive signed 64-bit sequence returned in nextCursor; omit on first page
      schema: { type: string, pattern: '^[0-9]{1,19}$' }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token returned by login, validated against its persisted session on every request
  responses:
    TelephonyFailure:
      description: >-
        Calling service error. Codes include TELEPHONY_NOT_CONFIGURED,
        TELEPHONY_AUTH_FAILED, TELEPHONY_INVALID_RESPONSE, TELEPHONY_REJECTED,
        TELEPHONY_UNAVAILABLE, TELEPHONY_TIMEOUT, PROVISIONING_PENDING and
        EXTENSION_CONFLICT. No provider secrets or raw response bodies are exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: VALIDATION_ERROR (field errors) or INVALID_REQUEST (JSON, unknown fields, parameters)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: UNAUTHORIZED - missing, invalid, expired, revoked token or blocked account
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer realm="alohub"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CallDetails:
      type: object
      required: [peer, direction, status, video, startedAt, endedAt]
      properties:
        peer: { type: string, maxLength: 320, example: 'sip:1002@pbx.test' }
        name: { type: string, maxLength: 255, nullable: true, example: 'Trần Hoàng Nam' }
        direction: { type: string, enum: [INCOMING, OUTGOING] }
        status:
          type: string
          enum: [COMPLETED, MISSED, DECLINED, CANCELED, BUSY, UNANSWERED, FAILED, INTERRUPTED, ANSWERED_ELSEWHERE]
        video:
          type: boolean
          description: Whether video was offered, or whether video was used if answered
        startedAt: { type: integer, format: int64, description: Call start in Unix milliseconds }
        answeredAt: { type: integer, format: int64, nullable: true, description: Connection time in Unix milliseconds }
        endedAt: { type: integer, format: int64, description: Call end in Unix milliseconds }
    CallWrite:
      allOf:
        - $ref: '#/components/schemas/CallDetails'
        - type: object
          required: [id]
          properties:
            id: { type: string, minLength: 1, maxLength: 255, description: Stable SIP or client call identifier }
            dialedPhoneNumber: { type: string, maxLength: 40, description: Original number normalized by the lookup for outgoing voice calls placed by number }
    CallPage:
      type: object
      required: [content, nextCursor]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CallEntry'
        nextCursor: { type: string, nullable: true, example: '1794934800000:42' }
    CallEntry:
      allOf:
        - $ref: '#/components/schemas/CallWrite'
        - type: object
          required: [sequence, unread]
          properties:
            sequence: { type: string, example: '42' }
            unread: { type: boolean, description: True for an unseen missed call }
    CallThreadPage:
      type: object
      required: [content, nextCursor]
      properties:
        content:
          type: array
          items:
            type: object
            required: [lastCall, missed]
            properties:
              lastCall: { $ref: '#/components/schemas/CallEntry' }
              missed: { $ref: '#/components/schemas/MissedCalls' }
        nextCursor: { type: string, nullable: true, example: '1794934800000:42' }
    MissedCalls:
      type: object
      required: [unread, through]
      properties:
        unread: { type: integer, format: int64, minimum: 0, example: 1 }
        through: { type: string, nullable: true, example: '42' }
    HistoryWrite:
      type: object
      required: [account, peer, name, direction, body, status, time]
      properties:
        account: { type: string, maxLength: 320, example: 'sip:1001@pbx.test' }
        peer: { type: string, maxLength: 320, example: 'sip:1002@pbx.test' }
        name: { type: string, minLength: 1, maxLength: 255, example: Bob }
        direction: { type: string, enum: [incoming, outgoing] }
        body: { type: string, minLength: 1, maxLength: 65535, example: 'Xin chào' }
        status:
          type: string
          enum: [pending, accepted, failed, received]
          description: Incoming requires received; outgoing requires pending, accepted or failed. SIP accepted is not delivered/read.
        time: { type: integer, format: int64, minimum: 1, maximum: 8640000000000000, description: Epoch milliseconds }
        senderName: { type: string, maxLength: 255, nullable: true }
    HistoryEntry:
      allOf:
        - $ref: '#/components/schemas/HistoryWrite'
        - type: object
          required: [id, sequence]
          properties:
            id: { type: string }
            sequence: { type: string, description: Database sequence as a decimal string }
            peerUserId:
              type: string
              format: uuid
              nullable: true
              description: User ID of the peer when the local app mapping is known.
            attachment:
              type: object
              required: [filename, contentType, size]
              properties:
                filename: {type: string, example: 'ảnh chia sẻ.png'}
                contentType: {type: string, example: image/png}
                size: {type: integer, format: int64, minimum: 1, maximum: 10485760}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password, displayName, phoneNumber]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9_.-]{3,32}$'
          description: Trimmed before validation; stored lowercase
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 40
          description: Unique after E.164 normalization. Vietnam is the default region for national numbers.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    UserProfile:
      type: object
      required: [id, username, email, displayName, role, status, createdAt, sip, phoneNumber, phoneCallingEnabled]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
        createdAt:
          type: string
          format: date-time
        phoneNumber:
          type: string
          nullable: true
          description: Own E.164 number. Null for legacy accounts pending backfill.
        phoneCallingEnabled:
          type: boolean
        sip:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SipSummary'
    DialedCall:
      type: object
      required: [id, phoneNumber, route, name, status, startedAt, answeredAt, endedAt]
      properties:
        id: {type: string, format: uuid}
        phoneNumber: {type: string}
        route: {type: string, enum: [APP_TO_APP, APP_TO_PHONE]}
        name: {type: string, nullable: true}
        status: {type: string, enum: [COMPLETED, DECLINED, CANCELED, BUSY, UNANSWERED, FAILED, INTERRUPTED]}
        startedAt: {type: integer, format: int64, description: Unix epoch milliseconds}
        answeredAt: {type: integer, format: int64, nullable: true, description: Unix epoch milliseconds}
        endedAt: {type: integer, format: int64, description: Unix epoch milliseconds}
    UserSummary:
      type: object
      required: [id, username, displayName, status, sip, online]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
        online:
          type: boolean
          description: At least one active application session has sent a recent heartbeat.
        sip:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SipSummary'
    SipSummary:
      type: object
      required: [extension, domain, provisioningStatus, extensionPresent]
      properties:
        extension:
          type: string
        domain:
          type: string
        provisioningStatus:
          type: string
          enum: [PROVISIONING, READY, FAILED, UNKNOWN]
        extensionPresent:
          type: boolean
          nullable: true
          description: Current PBX UUID and number match; null if not freshly checked. Not SIP online presence.
    SipCredentials:
      type: object
      required: [extension, domain, serverIp, wssUrl, password]
      properties:
        extension:
          type: string
        domain:
          type: string
        serverIp:
          type: string
        wssUrl:
          type: string
          format: uri
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserProfile'
    UserPage:
      type: object
      required: [content, page, size, totalElements, totalPages, hasNext]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean
    Problem:
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
