$kind: http-request
name: History Conversations
method: GET
url: '{{base_url}}/api/v1/message-history/conversations?size=30'
order: 4700
queryParams:
  - key: size
    value: '30'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Conversation page returned', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().content).to.be.an('array');
        pm.expect(pm.response.json()).to.have.property('nextCursor');
      });
