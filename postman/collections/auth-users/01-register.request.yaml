$kind: http-request
name: Register
method: POST
url: "{{base_url}}/api/v1/auth/register"
order: 1000
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "bob",
      "email": "bob@example.com",
      "password": "example-password",
      "displayName": "Bob",
      "phoneNumber": "+84900000002"
    }
