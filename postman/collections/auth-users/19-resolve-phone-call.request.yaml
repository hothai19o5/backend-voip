$kind: http-request
name: Resolve Phone Call
method: POST
url: '{{base_url}}/api/v1/calls/resolve'
order: 5800
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"phoneNumber": "028 3822 3456", "forcePstn": true}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Explicit phone-network destination returned', () => {
        pm.response.to.have.status(200);
        const destination = pm.response.json();
        pm.expect(destination.type).to.eql('APP_TO_PHONE');
        pm.expect(destination.phoneNumber).to.eql('+842838223456');
        pm.expect(destination.sipUri).to.match(/^sip:\+842838223456@[^@]+$/);
      });
