spring:
  config:
    import: optional:file:./.env[.properties],optional:file:./backend-voip/.env[.properties]
  application:
    name: backend-voip
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:25432/voip_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:voip@123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
  data:
    redis:
      repositories:
        enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

app:
  attachments:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:29000}
    bucket: ${MINIO_BUCKET:voip-attachments}
    access-key: ${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:}}
    secret-key: ${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:}}
  phone-calls:
    enabled: ${PHONE_CALLS_ENABLED:false}
  fusionpbx:
    api-url: ${FUSIONPBX_API_URL:https://10.155.199.136/app/rest_api/rest.php}
    api-token: ${FUSIONPBX_API_TOKEN:}
    domain-name: ${FUSIONPBX_DOMAIN_NAME:10.155.199.136}
    server-ip: ${FUSIONPBX_SERVER_IP:10.155.199.136}
    wss-url: ${FUSIONPBX_WSS_URL:wss://10.155.199.136:7443}
    credentials-key: ${FUSIONPBX_CREDENTIALS_KEY:}
    extension-start: ${FUSIONPBX_EXTENSION_START:1000}
    extension-end: ${FUSIONPBX_EXTENSION_END:9999}
    connect-timeout: ${FUSIONPBX_CONNECT_TIMEOUT:2s}
    request-timeout: ${FUSIONPBX_REQUEST_TIMEOUT:5s}
    verify-ssl: ${FUSIONPBX_VERIFY_SSL:true}
  auth:
    issuer: alohub
    token-ttl: ${AUTH_TOKEN_TTL:8h}
    # Empty means a random development key, invalidating tokens on restart.
    jwt-secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
